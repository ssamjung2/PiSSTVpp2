<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlowFrame Comprehensive Test Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #2a2a2a, #1e1e1e);
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #4a9eff;
        }
        .header-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .info-block {
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #4a9eff;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #2a2a2a, #252525);
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .category-section {
            margin-bottom: 40px;
        }
        .category-title {
            font-size: 1.5em;
            color: #4a9eff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #404040;
            text-transform: capitalize;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .test-card {
            background: #252525;
            border: 1px solid #404040;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .test-card:hover {
            border-color: #4a9eff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
        }
        .test-header {
            background: #2a2a2a;
            padding: 15px;
            border-bottom: 1px solid #404040;
        }
        .test-number {
            display: inline-block;
            background: #4a9eff;
            color: #1e1e1e;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85em;
            margin-right: 10px;
        }
        .test-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #e0e0e0;
        }
        .test-status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-pass {
            background: #4caf50;
            color: #fff;
        }
        .status-fail {
            background: #f44336;
            color: #fff;
        }
        .test-content {
            padding: 15px;
        }
        .metadata-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .metadata-item {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            border-left: 2px solid #404040;
        }
        .metadata-label {
            color: #999;
            font-weight: bold;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .metadata-value {
            color: #e0e0e0;
            word-break: break-all;
        }
        .images-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }
        .image-container {
            background: #1e1e1e;
            border: 1px solid #404040;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-label {
            background: #2a2a2a;
            padding: 8px;
            font-size: 0.85em;
            color: #999;
            border-bottom: 1px solid #404040;
        }
        .image-content {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            max-height: 300px;
            overflow: auto;
        }
        .image-content img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        .cli-command {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #4a9eff;
            word-break: break-all;
            overflow-x: auto;
        }
        .purpose-section {
            background: #1e1e1e;
            padding: 10px;
            border-left: 3px solid #4a9eff;
            margin: 10px 0;
            border-radius: 4px;
        }
        .section-title {
            font-size: 0.85em;
            font-weight: bold;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .section-content {
            color: #e0e0e0;
            font-size: 0.9em;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #404040;
            margin-top: 40px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🔬 SlowFrame Comprehensive Test Report</h1>
        <div class="header-info">
            <div class="info-block">
                <strong>Generated:</strong> 2026-02-14T16:01:19.925773
            </div>
            <div class="info-block">
                <strong>Total Tests:</strong> 0
            </div>
            <div class="info-block">
                <strong>Passed:</strong> 0
            </div>
            <div class="info-block">
                <strong>Failed:</strong> 0
            </div>
        </div>
    </header>
    
    <div class="summary-stats">
        <div class="stat-card">
            <div class="stat-number">0</div>
            <div class="stat-label">Total Tests</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" style="color: #4caf50;">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" style="color: #f44336;">0</div>
            <div class="stat-label">Failed</div>
        </div>
    </div>
    <footer>
        <p>SlowFrame Comprehensive Test Verification Report</p>
        <p>Generated by comprehensive_test_verification.py</p>
    </footer>
</div>
</body>
</html>
